<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة البندري العتيبي التعليمية</title>
<meta name="description" content="منصة تعليمية للصف السادس الابتدائي - الأستاذة البندري العتيبي">
<meta name="theme-color" content="#8B1A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== المتغيرات ===== */
:root {
  --primary: #8B1A4A;
  --primary-dark: #6B1238;
  --primary-light: #C2185B;
  --accent: #E91E8C;
  --accent-light: #F48FB1;
  --gold: #D4A017;
  --bg: #FFF5F8;
  --bg-card: #FFFFFF;
  --bg-soft: #FCE4EC;
  --text-dark: #1A1A2E;
  --text-body: #4A4A6A;
  --text-muted: #9E9E9E;
  --border: #F8BBD9;
  --success: #2E7D32;
  --warning: #F57F17;
  --info: #1565C0;
  --radius: 18px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(139,26,74,0.10);
  --shadow-lg: 0 12px 48px rgba(139,26,74,0.18);
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Tajawal','Cairo',sans-serif;
  background:var(--bg);color:var(--text-dark);
  direction:rtl;line-height:1.7;overflow-x:hidden;
}

/* ===== NAVBAR ===== */
.navbar{
  background:#fff;border-bottom:2px solid var(--border);
  padding:0 1.5rem;position:sticky;top:0;z-index:999;
  box-shadow:0 2px 20px rgba(139,26,74,0.08);
  display:flex;align-items:center;justify-content:space-between;height:68px;
}
.navbar-brand{display:flex;align-items:center;gap:0.7rem;text-decoration:none;cursor:pointer;}
.brand-avatar{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(139,26,74,0.35);flex-shrink:0;
}
.brand-text h2{font-size:0.92rem;font-weight:800;color:var(--primary);line-height:1.2;}
.brand-text span{font-size:0.70rem;color:var(--text-muted);}
.navbar-nav{display:flex;gap:0.2rem;list-style:none;align-items:center;}
.navbar-nav a{
  padding:0.4rem 0.9rem;border-radius:var(--radius-sm);
  text-decoration:none;color:var(--text-body);
  font-weight:600;font-size:0.87rem;transition:var(--transition);cursor:pointer;
}
.navbar-nav a:hover,.navbar-nav a.active{background:var(--bg-soft);color:var(--primary);}
.navbar-actions{display:flex;gap:0.6rem;align-items:center;}
.dark-toggle{
  background:none;border:1.5px solid var(--border);border-radius:50%;
  width:36px;height:36px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:0.95rem;transition:var(--transition);
}
.dark-toggle:hover{background:var(--bg-soft);border-color:var(--primary);}
.hamburger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:5px;}
.hamburger span{display:block;width:22px;height:2.5px;background:var(--primary);border-radius:2px;transition:var(--transition);}

/* ===== BTNS ===== */
.btn{
  padding:0.6rem 1.3rem;border-radius:var(--radius-sm);
  font-weight:700;font-size:0.88rem;cursor:pointer;border:none;
  transition:var(--transition);text-decoration:none;
  display:inline-flex;align-items:center;gap:0.45rem;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 16px rgba(139,26,74,0.35);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(139,26,74,0.45);}
.btn-white{background:#fff;color:var(--primary);}
.btn-white:hover{background:var(--bg-soft);transform:translateY(-2px);}
.btn-outline-white{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.4);}
.btn-outline-white:hover{background:rgba(255,255,255,0.25);transform:translateY(-2px);}
.btn-ghost{background:var(--bg-soft);color:var(--primary);}
.btn-ghost:hover{background:var(--border);}
.btn-sm{padding:0.38rem 0.85rem;font-size:0.78rem;}
.btn-danger{background:#C62828;color:#fff;}
.btn-danger:hover{background:#B71C1C;}
.btn-success{background:var(--success);color:#fff;}

/* ===== HERO ===== */
.hero{
  display:grid;grid-template-columns:1fr 1.65fr;
  min-height:500px;margin:1.5rem;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-lg);
}
.hero-info{background:#fff;padding:2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;}
.teacher-card{display:flex;flex-direction:column;align-items:center;gap:0.4rem;text-align:center;}
.teacher-avatar{
  width:76px;height:76px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;box-shadow:0 6px 24px rgba(139,26,74,0.3);
}
.teacher-card h3{font-size:0.97rem;font-weight:800;color:var(--primary);}
.teacher-card p{font-size:0.78rem;color:var(--text-muted);}
.feature-list{display:flex;flex-direction:column;gap:0.55rem;}
.feature-item{
  display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.9rem;
  border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);
}
.feature-item .ico{font-size:1.15rem;}
.feature-item h4{font-size:0.82rem;font-weight:700;color:var(--text-dark);}
.feature-item p{font-size:0.73rem;color:var(--text-muted);}

.hero-main{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 50%,var(--accent) 100%);
  padding:2.5rem;display:flex;flex-direction:column;justify-content:center;
  color:#fff;position:relative;overflow:hidden;
}
.hero-main::before{content:'';position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:rgba(255,255,255,0.07);border-radius:50%;}
.hero-main::after{content:'';position:absolute;bottom:-40px;right:-40px;width:140px;height:140px;background:rgba(255,255,255,0.05);border-radius:50%;}
.hero-badge{
  display:inline-flex;align-items:center;gap:0.4rem;
  background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.25);border-radius:50px;
  padding:0.3rem 0.9rem;font-size:0.76rem;font-weight:600;
  width:fit-content;margin-bottom:0.5rem;
}
.hero-main h1{font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:900;line-height:1.25;margin-bottom:0.7rem;}
.hero-main p{font-size:0.92rem;opacity:0.9;line-height:1.7;max-width:440px;margin-bottom:1.4rem;}
.hero-buttons{display:flex;gap:0.7rem;flex-wrap:wrap;}

/* ===== SECTION ===== */
.section{padding:2.5rem 1.5rem;}
.section-title{font-size:1.55rem;font-weight:900;color:var(--text-dark);margin-bottom:0.3rem;}
.section-subtitle{color:var(--text-muted);font-size:0.87rem;margin-bottom:1.4rem;}

/* ===== CARDS ===== */
.subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:1.15rem;}
.subject-card{
  background:var(--bg-card);border-radius:var(--radius);padding:1.4rem;
  border:1.5px solid var(--border);transition:var(--transition);cursor:pointer;
  position:relative;overflow:hidden;
}
.subject-card::before{
  content:'';position:absolute;top:0;right:0;width:100%;height:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:var(--radius) var(--radius) 0 0;
}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--accent-light);}
.subject-icon{
  width:52px;height:52px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;margin-bottom:0.9rem;
}
.subject-card h3{font-size:1rem;font-weight:800;margin-bottom:0.35rem;}
.subject-card p{font-size:0.80rem;color:var(--text-muted);line-height:1.6;margin-bottom:0.9rem;}
.subject-tags{display:flex;gap:0.35rem;flex-wrap:wrap;}

.tag{padding:0.18rem 0.6rem;border-radius:50px;font-size:0.72rem;font-weight:600;}
.tag-green{background:#E8F5E9;color:#2E7D32;}
.tag-yellow{background:#FFF8E1;color:#F57F17;}
.tag-pink{background:var(--bg-soft);color:var(--primary);}
.tag-blue{background:#E3F2FD;color:#1565C0;}
.tag-purple{background:#F3E5F5;color:#6A1B9A;}

/* ===== FEATURES ===== */
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
.feature-card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.4rem;text-align:center;
  border:1.5px solid var(--border);transition:var(--transition);
}
.feature-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.feature-card .icon-wrap{
  width:52px;height:52px;border-radius:15px;background:var(--bg-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;margin:0 auto 0.9rem;
}
.feature-card h4{font-size:0.88rem;font-weight:700;margin-bottom:0.35rem;}
.feature-card p{font-size:0.77rem;color:var(--text-muted);line-height:1.6;}

/* ===== LESSONS LAYOUT ===== */
.lessons-layout{display:grid;grid-template-columns:1fr 290px;gap:1.4rem;align-items:start;}
.units-sidebar{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.2rem;border:1.5px solid var(--border);
  position:sticky;top:85px;
}
.units-sidebar h3{font-size:0.92rem;font-weight:800;margin-bottom:0.9rem;color:var(--primary);}
.unit-btn{
  width:100%;padding:0.6rem 0.9rem;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:none;text-align:right;
  cursor:pointer;font-family:inherit;font-size:0.81rem;font-weight:600;
  color:var(--text-body);transition:var(--transition);margin-bottom:0.35rem;display:block;
}
.unit-btn:hover,.unit-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.unit-content-area{flex:1;}
.unit-header{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.75rem;margin-bottom:1.15rem;
  border:1.5px solid var(--border);box-shadow:var(--shadow);
}
.unit-header h2{font-size:1.3rem;font-weight:900;color:var(--primary);margin-bottom:0.35rem;}
.unit-header p{font-size:0.85rem;color:var(--text-muted);}
.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;}
.lesson-card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.2rem;border:1.5px solid var(--border);
  transition:var(--transition);cursor:pointer;
}
.lesson-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent-light);}
.lesson-card h4{font-size:0.88rem;font-weight:800;margin-bottom:0.35rem;}
.lesson-card p{font-size:0.77rem;color:var(--text-muted);margin-bottom:0.9rem;line-height:1.6;}
.lesson-actions{display:flex;gap:0.35rem;flex-wrap:wrap;}

/* ===== PROGRESS BAR ===== */
.progress-bar-wrap{background:var(--border);border-radius:50px;height:7px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:50px;transition:width 0.6s ease;}

/* ===== SEARCH ===== */
.search-bar{position:relative;}
.search-bar input{
  width:100%;padding:0.7rem 1.2rem 0.7rem 2.8rem;
  border:1.5px solid var(--border);border-radius:50px;
  font-family:inherit;font-size:0.87rem;background:var(--bg-card);
  color:var(--text-dark);outline:none;transition:var(--transition);direction:rtl;
}
.search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,26,74,0.10);}
.search-icon{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.95rem;}

/* ===== LESSON PAGE ===== */
.lesson-page{max-width:880px;margin:0 auto;padding:2rem 1.5rem;}
.lesson-header-card{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;border-radius:var(--radius);padding:2rem;margin-bottom:1.4rem;
  position:relative;overflow:hidden;
}
.lesson-header-card::after{content:'';position:absolute;bottom:-30px;left:-30px;width:110px;height:110px;background:rgba(255,255,255,0.07);border-radius:50%;}
.lesson-num{font-size:0.76rem;opacity:0.8;margin-bottom:0.35rem;}
.lesson-header-card h1{font-size:1.55rem;font-weight:900;margin-bottom:0.7rem;}
.lesson-objectives{display:flex;flex-direction:column;gap:0.35rem;margin-top:0.7rem;}
.objective-item{display:flex;align-items:center;gap:0.5rem;font-size:0.83rem;opacity:0.95;}
.objective-item::before{
  content:'✓';width:20px;height:20px;background:rgba(255,255,255,0.2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;flex-shrink:0;
}
.lesson-content-card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.65rem;border:1.5px solid var(--border);margin-bottom:1.2rem;
}
.lesson-content-card h3{
  font-size:0.97rem;font-weight:800;color:var(--primary);margin-bottom:0.9rem;
  padding-bottom:0.45rem;border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:0.45rem;
}
.lesson-text{font-size:0.88rem;line-height:1.95;color:var(--text-body);}
.video-placeholder{
  background:var(--bg);border-radius:var(--radius-sm);height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px dashed var(--border);gap:0.45rem;color:var(--text-muted);font-size:0.83rem;
}
.video-placeholder .play-icon{font-size:2.4rem;}

/* ===== QUIZ ===== */
.quiz-container{display:flex;flex-direction:column;gap:1.15rem;}
.quiz-question{background:var(--bg-card);border-radius:var(--radius);padding:1.4rem;border:1.5px solid var(--border);}
.question-text{font-size:0.88rem;font-weight:700;margin-bottom:0.9rem;color:var(--text-dark);}
.quiz-options{display:flex;flex-direction:column;gap:0.55rem;}
.quiz-option{
  padding:0.65rem 1rem;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  cursor:pointer;font-size:0.83rem;transition:var(--transition);
  background:var(--bg);font-family:inherit;text-align:right;
}
.quiz-option:hover{border-color:var(--accent-light);background:var(--bg-soft);}
.quiz-option.correct{border-color:var(--success);background:#E8F5E9;color:var(--success);font-weight:700;}
.quiz-option.wrong{border-color:#C62828;background:#FFEBEE;color:#C62828;}

/* ===== LESSON NAV ===== */
.lesson-nav{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  margin-top:1.4rem;padding:1.2rem;background:var(--bg-card);
  border-radius:var(--radius);border:1.5px solid var(--border);
}

/* ===== DASHBOARD ===== */
.dashboard-layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px);}
.dashboard-sidebar{background:var(--primary);color:#fff;padding:1.4rem 0.9rem;}
.dashboard-sidebar .ds-logo{text-align:center;margin-bottom:1.4rem;padding-bottom:1.2rem;border-bottom:1px solid rgba(255,255,255,0.15);}
.dashboard-sidebar .ds-logo .av{width:52px;height:52px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 0.4rem;}
.dashboard-sidebar .ds-logo p{font-size:0.76rem;opacity:0.75;}
.ds-section-title{font-size:0.7rem;opacity:0.55;text-transform:uppercase;letter-spacing:0.07em;margin:1.1rem 0 0.5rem 0;padding-right:0.5rem;}
.sidebar-link{
  display:flex;align-items:center;gap:0.65rem;padding:0.65rem 0.75rem;
  border-radius:var(--radius-sm);color:rgba(255,255,255,0.8);
  text-decoration:none;font-size:0.85rem;font-weight:600;
  transition:var(--transition);margin-bottom:0.22rem;
  cursor:pointer;background:none;border:none;width:100%;text-align:right;font-family:inherit;
}
.sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,0.15);color:#fff;}
.dashboard-main{padding:1.75rem;background:var(--bg);overflow-y:auto;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem;margin-bottom:1.75rem;}
.stat-card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:1.2rem;border:1.5px solid var(--border);
  display:flex;align-items:center;gap:0.9rem;
}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;}
.stat-card .num{font-size:1.4rem;font-weight:900;color:var(--primary);}
.stat-card .lbl{font-size:0.76rem;color:var(--text-muted);}

/* ===== TABLE ===== */
.data-table{width:100%;border-collapse:collapse;font-size:0.83rem;}
.data-table th{background:var(--bg-soft);color:var(--primary);padding:0.7rem 0.9rem;text-align:right;font-weight:700;border-bottom:2px solid var(--border);}
.data-table td{padding:0.7rem 0.9rem;border-bottom:1px solid var(--border);color:var(--text-body);}
.data-table tr:hover td{background:var(--bg);}

/* ===== DARK MODE ===== */
body.dark-mode{
  --bg:#0F0F1A;--bg-card:#1A1A2E;--bg-soft:#16213E;
  --text-dark:#F0F0FF;--text-body:#B0B0D0;--border:#2A2A4A;
}
body.dark-mode .navbar{background:#1A1A2E;border-color:#2A2A4A;}
body.dark-mode .hero-info{background:#1A1A2E;}

/* ===== FOOTER ===== */
.footer{background:var(--primary-dark);color:rgba(255,255,255,0.8);text-align:center;padding:1.4rem;font-size:0.81rem;margin-top:2.5rem;}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.52);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:var(--transition);}
.modal-overlay.open{opacity:1;visibility:visible;}
.modal{background:var(--bg-card);border-radius:var(--radius);padding:1.75rem;max-width:540px;width:90%;box-shadow:var(--shadow-lg);transform:scale(0.95);transition:var(--transition);}
.modal-overlay.open .modal{transform:scale(1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
.modal-header h3{font-size:1.02rem;font-weight:800;color:var(--primary);}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--text-muted);line-height:1;}

/* ===== FORM ===== */
.form-group{margin-bottom:0.9rem;}
.form-group label{display:block;font-size:0.81rem;font-weight:700;margin-bottom:0.35rem;color:var(--text-body);}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:0.62rem 0.9rem;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);font-family:inherit;font-size:0.86rem;
  background:var(--bg);color:var(--text-dark);outline:none;
  transition:var(--transition);direction:rtl;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,26,74,0.10);}
.form-group textarea{resize:vertical;min-height:95px;}

/* ===== SKELETON ===== */
.skeleton{
  background:linear-gradient(90deg,var(--border) 25%,var(--bg-soft) 50%,var(--border) 75%);
  background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--radius-sm);
}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ===== NOTIFICATION ===== */
.notification{
  position:fixed;top:85px;left:1.4rem;
  background:var(--bg-card);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:0.8rem 1.2rem;
  box-shadow:var(--shadow-lg);font-size:0.85rem;font-weight:600;
  display:flex;align-items:center;gap:0.55rem;z-index:9998;
  transform:translateX(-120%);transition:transform 0.35s ease;
}
.notification.show{transform:translateX(0);}
.notification.success{border-color:var(--success);color:var(--success);}
.notification.error{border-color:#C62828;color:#C62828;}
.notification.info{border-color:var(--info);color:var(--info);}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.ani{animation:fadeInUp 0.45s ease forwards;}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .navbar-nav{display:none;}

let S = {
  page:'home', book:null, unit:null, lesson:null,
  dark:false, progress:{}, navOpen:false, quizAnswers:{}
};

function loadState(){
  try{const d=JSON.parse(localStorage.getItem('albandari')||'{}');S.dark=d.dark||false;S.progress=d.progress||{};}catch(e){}
  applyDark();
}
function saveState(){
  try{localStorage.setItem('albandari',JSON.stringify({dark:S.dark,progress:S.progress}));}catch(e){}
}

// ======================================================
// ===== DARK MODE =====
// ======================================================
function toggleDarkMode(){S.dark=!S.dark;applyDark();saveState();}
function applyDark(){
  document.body.classList.toggle('dark-mode',S.dark);
  const b=document.getElementById('darkToggle');
  if(b)b.textContent=S.dark?'☀️':'🌙';
}

// ======================================================
// ===== ROUTER =====
// ======================================================
function navigate(page, params={}){
  S.page=page; Object.assign(S,params);
  render(); window.scrollTo(0,0);
}

function render(){
  const app=document.getElementById('app');
  switch(S.page){
    case 'home':       app.innerHTML=pageHome(); break;
    case 'subjects':   app.innerHTML=pageSubjects(); break;
    case 'lessons':    app.innerHTML=pageLessons(); break;
    case 'lesson':     app.innerHTML=pageLesson(); break;
    case 'dashboard':  app.innerHTML=pageDashboard(); break;
    case 'quiz_gen':   app.innerHTML=pageQuizGen(); break;
    case 'search':     app.innerHTML=pageSearch(); break;
    default:           app.innerHTML=pageHome();
  }
  bindEvents();
  applyDark();
}

function doSearch(q){
  const res=document.getElementById('srchResults');
  if(!res)return;
  if(q.length<2){res.innerHTML='';return;}
  const found=[];
  DATA.books.forEach(b=>b.units.forEach(u=>u.lessons.forEach(l=>{
    if(l.title.includes(q)||l.content.includes(q)) found.push({b,u,l});
  })));
  res.style.cssText='position:absolute;top:100%;right:0;width:100%;background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:999;max-height:260px;overflow-y:auto;';
  res.innerHTML=found.length
    ?found.map(({b,u,l})=>`<div style="padding:0.65rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;font-size:0.83rem;" onclick="openLesson('${b.id}','${u.id}','${l.id}')"><strong>${l.title}</strong> <span style="color:var(--text-muted);font-size:0.73rem;">• ${b.title}</span></div>`).join('')
    :`<div style="padding:1rem;color:var(--text-muted);text-align:center;font-size:0.83rem;">لا نتائج لـ "${q}"</div>`;
}

function openLesson(bookId,unitId,lessonId){
  const book=DATA.books.find(b=>b.id===bookId);
  const unit=book?.units.find(u=>u.id===unitId);
  const lesson=unit?.lessons.find(l=>l.id===lessonId);
  if(lesson) navigate('lesson',{book,unit,lesson});
}

  if(!lesson) return pageHome();

  // تحديث التقدم
  if(!S.progress[book.id]) S.progress[book.id]=0;
  const total=book.units.reduce((a,u)=>a+u.lessons.length,0);
  const doneIdx=book.units.flatMap(u=>u.lessons).findIndex(l=>l.id===lesson.id)+1;
  S.progress[book.id]=Math.max(S.progress[book.id],Math.round(doneIdx/total*100));
  saveState();

  const allL=unit.lessons;
  const idx=allL.findIndex(l=>l.id===lesson.id);

    ${prev?`<button class="btn btn-ghost" onclick="openLesson('${book.id}','${unit.id}','${prev.id}')">← ${prev.title}</button>`:'<div></div>'}

    ${next?`<button class="btn btn-primary" onclick="openLesson('${book.id}','${unit.id}','${next.id}')">التالي: ${next.title} →</button>`:'<button class="btn btn-success" onclick="notify(\'أحسنت! أكملت هذه الوحدة 🎉\',\'success\')">🏆 أكملت الوحدة!</button>'}
  </div>
</div>`;
}

function renderQuiz(questions,prefix='q'){
  if(!questions||!questions.length) return '<p style="color:var(--text-muted);font-size:0.83rem;">لا يوجد اختبار لهذا الدرس حالياً.</p>';
  return `<div class="quiz-container">
    ${questions.map((q,qi)=>`
    <div class="quiz-question" id="${prefix}_q${qi}">
      <div class="question-text">${qi+1}. ${q.q}</div>
      <div class="quiz-options">
        ${q.opts.map((opt,oi)=>`
        <div class="quiz-option" id="${prefix}_${qi}_${oi}" onclick="checkAns('${prefix}',${qi},${oi},${q.c},${q.opts.length})">
          ${['أ','ب','ج','د'][oi]}. ${opt}
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div>`;
}

function checkAns(prefix,qi,selected,correct,total){
  for(let i=0;i<total;i++){
    const el=document.getElementById(`${prefix}_${qi}_${i}`);
    if(!el)continue;
    el.style.pointerEvents='none';
    if(i===correct) el.classList.add('correct');
    else if(i===selected&&selected!==correct) el.classList.add('wrong');
  }
}

    <p style="font-size:0.83rem;color:var(--text-muted);margin-bottom:1.4rem;">اختر الدرس وسيقوم الذكاء الاصطناعي بتوليد أسئلة اختيار من متعدد تلقائياً</p>

      </select>

    <div class="form-group">
      <label>عدد الأسئلة المطلوبة</label>
      <select id="aiNumQ">
        <option value="3">٣ أسئلة</option>
        <option value="5" selected>٥ أسئلة</option>
        <option value="8">٨ أسئلة</option>
        <option value="10">١٠ أسئلة</option>
      </select>
    </div>
    <div class="form-group">
      <label>محتوى إضافي (اختياري)</label>
      <textarea id="aiExtra" placeholder="أضف أي معلومات إضافية تريد أن تُبنى عليها الأسئلة..."></textarea>
    </div>
    <button class="btn btn-primary" id="aiBtn" onclick="runAI()">🤖 توليد الأسئلة</button>
    <div id="aiOut" style="margin-top:1.5rem;"></div>
  </div>
</div>`;
}

async function runAI(){
  const sel=document.getElementById('aiLessonSel')?.value;
  const num=document.getElementById('aiNumQ')?.value||'5';
  const extra=document.getElementById('aiExtra')?.value||'';
  const btn=document.getElementById('aiBtn');
  const out=document.getElementById('aiOut');
  if(!sel||!btn||!out)return;

  const [bId,uId,lId]=sel.split('|');
  const book=DATA.books.find(b=>b.id===bId);
  const unit=book?.units.find(u=>u.id===uId);
  const lesson=unit?.lessons.find(l=>l.id===lId);
  if(!lesson)return;

  btn.disabled=true;
  btn.innerHTML='⏳ جاري التوليد...';
  out.innerHTML=`<div class="skeleton" style="height:180px;border-radius:var(--radius);"></div>`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:`أنت معلم متخصص في إنشاء الأسئلة التعليمية بالعربية. قم بإنشاء ${num} أسئلة اختيار من متعدد (٤ خيارات لكل سؤال) عن:

عنوان الدرس: ${lesson.title}
المحتوى:
${lesson.content}
${extra?'محتوى إضافي: '+extra:''}

الأهداف: ${lesson.obj.join(' — ')}

أعد الإجابة بتنسيق JSON فقط بهذا الشكل بدون أي نص قبله أو بعده:
[{"q":"نص السؤال","opts":["الخيار أ","الخيار ب","الخيار ج","الخيار د"],"c":0}]
حيث c هو رقم الإجابة الصحيحة (0-3).`}]
      })
    });
    const data=await resp.json();
    const text=data.content?.[0]?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const questions=JSON.parse(clean);

    out.innerHTML=`
      <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;">
        <span style="background:#E8F5E9;color:#2E7D32;padding:0.25rem 0.7rem;border-radius:50px;font-size:0.78rem;font-weight:700;">✅ تم توليد ${questions.length} أسئلة</span>
        <button class="btn btn-ghost btn-sm" onclick="printQuiz()">🖨️ طباعة</button>
      </div>
      ${renderQuiz(questions,'ai')}`;
  }catch(e){
    out.innerHTML=`<div style="color:#C62828;font-size:0.83rem;padding:0.9rem;background:#FFEBEE;border-radius:var(--radius-sm);">⚠️ حدث خطأ في التوليد. تأكد من اتصالك بالإنترنت وحاول مجدداً.</div>`;
  }
  btn.disabled=false;
  btn.innerHTML='🤖 توليد الأسئلة';
}

function printQuiz(){
  window.print();
}

    body.innerHTML=`

    <div class="form-group"><label>الخيار د</label><input id="mO3" placeholder="الخيار الرابع..."></div>
    <div class="form-group"><label>الإجابة الصحيحة</label>
    <select id="mC"><option value="0">أ</option><option value="1">ب</option><option value="2">ج</option><option value="3">د</option></select></div>

      <button class="btn btn-ghost" onclick="closeModalDirect()">إلغاء</button>
      <button class="btn btn-primary" onclick="notify('تم إضافة السؤال بنجاح ✅','success');closeModalDirect()">حفظ</button>

function closeModal(e){if(e.target.id==='modalOverlay')closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay')?.classList.remove('open');}

// ======================================================
// ===== NOTIFICATION =====
// ======================================================
function notify(msg,type='success'){
  const n=document.getElementById('notification');
  if(!n)return;
  n.className=`notification ${type} show`;
  n.innerHTML={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'}[type]+' '+msg;
  setTimeout(()=>n.classList.remove('show'),3200);
}

  S.navOpen=!S.navOpen;
  const nav=document.getElementById('mobileNav');

// ======================================================
// ===== BIND EVENTS =====
// ======================================================
function bindEvents(){
  // إغلاق نتائج البحث عند النقر خارجها
  document.addEventListener('click', function handler(e){
    const res=document.getElementById('srchResults');
    if(res&&!res.contains(e.target)&&!document.getElementById('srch')?.contains(e.target)){
      res.innerHTML='';
    }
    document.removeEventListener('click',handler);
  });
}

// ===== INIT =====
// ======================================================
function init(){
  loadState();
  render();
}

// تشغيل فوري بدون انتظار DOMContentLoaded
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// خط دفاع ثانٍ - window.onload
window.addEventListener('load', function(){
  const app=document.getElementById('app');
  if(app && app.querySelector('.progress-bar-fill')===null && app.querySelector('input')===null){
    // لا تزال في شاشة التحميل — أعد التهيئة
    init();
  }
});
</script>
